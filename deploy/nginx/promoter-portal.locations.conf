# Include inside the existing hanjinghealth.com server block.
# Deploy the contents of the promoter dist directory to:
# /www/wwwroot/hanjing/promoter-portal/
# Keep the existing /api/, /uploads/ and admin root configuration.

location = /promoter-portal {
    return 301 /promoter-portal/$is_args$args;
}

location ^~ /promoter-portal/ {
    root /www/wwwroot/hanjing;
    index index.html;
    try_files $uri $uri/ /promoter-portal/index.html;
}
