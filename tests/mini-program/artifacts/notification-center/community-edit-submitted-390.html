<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Microsoft Yahei',sans-serif}view,text{display:block}input,textarea{border:0;font:inherit}.navbar{height:56px;padding:18px;background:white;text-align:center;font-weight:600}.community-publish-page { min-height: 100vh; background: #f3f4f6; padding-bottom: calc(env(safe-area-inset-bottom, 34px) + 62.4px); }
