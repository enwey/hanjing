<!doctype html><meta charset="utf-8"><style>.profile-page {
  min-height: 100vh;
  background: #f9fafb;
  display: flex;
  flex-direction: column;
}

.page-content {
  flex: 1;
  padding: 16px 16px 0;
}

.user-card {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
  padding: 20px;
  border-radius: 16px;
  background: #ffffff;
}

.user-avatar {
  width: 56px;
  height: 56px;
  margin-right: 12px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #3b6bf5, #8eafff);
}

.user-avatar-placeholder {
  width: 100%;
  height: 100%;
  display: block;
  position: absolute;
  inset: 0;
}

.user-avatar-image {
  width: 100%;
  height: 100%;
  display: block;
  position: absolute;
  inset: 0;
}

.user-info {
  flex: 1;
}

.user-name {
  display: block;
  margin-bottom: 4px;
  font-size: 20px;
  font-weight: 700;
  color: #1f2937;
}

.user-level-tag {
  display: inline-flex;
  padding: 2px 8px;
  border-radius: 10px;
  background: #fff9e6;
  font-size: 12px;
  font-weight: 500;
  color: #f5a623;
}

.user-arrow {
  font-size: 24px;
  color: #d1d5db;
}

.profile-setup-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 14px 16px;
  border-radius: 14px;
  background: linear-gradient(135deg, #fff7e8 0%, #fffaf2 100%);
  border: 0.5px solid rgba(243, 155, 26, 0.18);
}

.profile-setup-card__body {
  flex: 1;
}

.profile-setup-card__title {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: #7c4a03;
}

.profile-setup-card__desc {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.6;
  color: #9a6a27;
}

.profile-setup-card__action {
  padding: 7px 12px;
  border-radius: 4999.5px;
  background: #f39b1a;
  font-size: 12px;
  font-weight: 600;
  color: #ffffff;
  flex-shrink: 0;
}

.menu-group {
  margin-bottom: 8px;
}

.menu-group-title {
  display: block;
  padding: 8px 0 4px;
  font-size: 13px;
  font-weight: 500;
  color: #9ca3af;
}

.menu-list {
  overflow: hidden;
  border-radius: 12px;
  background: #ffffff;
}

.menu-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
}

.menu-item:not(:last-child) {
  border-bottom: 0.5px solid #f3f4f6;
}

.menu-icon {
  width: 18px;
  height: 18px;
  margin-right: 12px;
  flex-shrink: 0;
}

.menu-icon--distribution {
  width: 21px;
  height: 21px;
}

.menu-label {
  flex: 1;
  font-size: 15px;
  color: #374151;
}

.menu-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  margin-right: 8px;
  border-radius: 4999.5px;
  background: #ef4444;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #ffffff;
  box-sizing: border-box;
  flex-shrink: 0;
}

.menu-arrow {
  font-size: 20px;
  color: #d1d5db;
}

.safe-bottom {
  height: calc(env(safe-area-inset-bottom, 34px) + 20px);
}
