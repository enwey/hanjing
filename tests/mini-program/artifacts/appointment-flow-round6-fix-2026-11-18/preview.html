<!doctype html><meta charset="utf-8"><style>.page {
  min-height: 100vh;
  background: #f9fafb;
}

.page-content {
  padding: 0 24px 40px;
}

.state-card {
  padding-top: 80px;
  text-align: center;
}

.state-text {
  display: block;
  font-size: 14px;
  line-height: 1.6;
  color: #6b7280;
}

.result-retry-btn {
  margin: 12px auto;
  background: #eaf0ff;
  color: #294ca8;
  font-size: 14px;
}

.footer-btn {
  flex: 1;
  height: 46px;
  line-height: 45px;
  margin: 0;
  padding: 0;
  border-radius: 4999.5px;
  font-size: 14px;
  font-weight: 600;
}
.btn-ghost {
  border: 0.5px solid #d1d5db;
  background: #ffffff;
  color: #6b7280;
}
.btn-danger-ghost {
  border: 0.5px solid #fca5a5;
  background: #ffffff;
  color: #ef4444;
}
.apt-btn {
  font-size: 13px;
  padding: 6px 16px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  background: #fff;
  color: #6b7280;
  line-height: 1;
  margin: 0;
}body{background:#f9fafb;font:16px system-ui}section{margin:12px auto;max-width:360px;padding:16px;background:white}h2{font-size:15px}.state-card{padding:12px}button{border:0;min-height:34px}</style><section><h2>预约结果超时</h2><div class="page-content state-card">
    <span class="state-text">预约结果请求超时</span>
    <button class="result-retry-btn" bindtap="retryLoad">重试</button>
    <button bindtap="openAppointmentDetail">查看预约详情</button>
  </div></section><section><h2>就诊中 · 已退款</h2><span>医生已叫号，就诊进行中</span><p>该预约已退款</p></section><section><h2>已提醒预约详情</h2><button class="footer-btn btn-danger-ghost" hover-class="footer-btn-hover" bindtap="cancelAppointment">取消</button></section><section><h2>可改约的预约列表</h2><button class="apt-btn apt-btn--ghost" catchtap="handleRescheduleTap">改约</button></section>
