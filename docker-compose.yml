services:
  backend:
    build:
      context: ./hanjing-clinic-backend
    container_name: hanjing-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set the existing private PII key or migrate encrypted data first}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TZ: Asia/Shanghai
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-hanjing_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-hanjing_clinic}
      PORT: 5005
      WX_MINI_APP_ID: ${WX_MINI_APP_ID:-}
      WX_MINI_APP_SECRET: ${WX_MINI_APP_SECRET:-}
    ports:
      - "127.0.0.1:5005:5005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5005/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - hanjing_backend_uploads:/app/uploads
      - hanjing_backend_logs:/app/logs

volumes:
  hanjing_backend_uploads:
  hanjing_backend_logs:
